<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Login Page - Vaibhav</title>

   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    
    <link rel="stylesheet" href="style.css">

    
    <script src="script.js" defer></script>
</head>

<body>

    <div class="container" id="container">

        
        <div class="form-container sign-up">
            <form id="signUpForm">

                <h1>Create Account</h1>

                <div class="social-icon">
                    <a href="#" class="icon" aria-label="Google">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a href="#" class="icon" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" class="icon" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#" class="icon" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                </div>

                <span>or use your email for registration</span>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Name"
                    autocomplete="name"
                    required
                >

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <div class="password-box">
                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Password"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="signupPassword"
                        aria-label="Show password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <button type="submit">Sign Up</button>

                <p class="message" id="signupMessage"></p>

            </form>
        </div>


        
        <div class="form-container sign-in">
            <form id="signInForm">

                <h1>Sign In</h1>

                <div class="social-icon">
                    <a href="#" class="icon" aria-label="Google">
                        <i class="fa-brands fa-google"></i>
                    </a>

                    <a href="#" class="icon" aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>

                    <a href="#" class="icon" aria-label="GitHub">
                        <i class="fa-brands fa-github"></i>
                    </a>

                    <a href="#" class="icon" aria-label="LinkedIn">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                </div>

                <span>or use your email and password</span>

                <input
                    type="email"
                    id="signinEmail"
                    placeholder="Email"
                    autocomplete="email"
                    required
                >

                <div class="password-box">
                    <input
                        type="password"
                        id="signinPassword"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        data-target="signinPassword"
                        aria-label="Show password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>

                <a href="#" id="forgotPassword">Forgot Password?</a>

                <button type="submit">Sign In</button>

                <p class="message" id="signinMessage"></p>

            </form>
        </div>


       
        <div class="toggle-container">

            <div class="toggle">

                
                <div class="toggle-panel toggle-left">

                    <h1>Welcome Back!</h1>

                    <p>
                        Enter your personal details to use all of
                        the site features.
                    </p>

                    <button
                        type="button"
                        class="hidden"
                        id="login"
                    >
                        Sign In
                    </button>

                </div>


                
                <div class="toggle-panel toggle-right">

                    <h1>Hello Friend!</h1>

                    <p>
                        Register your personal details to use all
                        of the site features.
                    </p>

                    <button
                        type="button"
                        class="hidden"
                        id="register"
                    >
                        Sign Up
                    </button>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
